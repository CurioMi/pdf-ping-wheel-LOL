name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请描述使用场景和希望解决的问题。不要附带第三方游戏素材。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 当前工作流哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案（可选）
