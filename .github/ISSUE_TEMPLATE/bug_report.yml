name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issues。不要上传包含个人信息或敏感内容的 PDF，也不要上传第三方游戏素材。
  - type: input
    id: browser
    attributes:
      label: 浏览器及版本
      placeholder: Chrome 155 / Edge 155
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / macOS / Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 其他信息（可选）
