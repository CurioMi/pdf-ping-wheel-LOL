name: Publish v1.5.2 install ZIP with game assets

on:
  push:
    paths:
      - '.github/release-trigger-v1.5.2.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download and validate League game assets
        run: bash scripts/download-riot-assets.sh
      - name: Build extension with bundled assets
        run: npm run build
      - name: Verify PDF roundtrip
        run: npm run verify
      - name: Verify static behavior
        run: npm run verify:static
      - name: Verify PDF annotations and migration
        run: npm run verify:pdf
      - name: Package install ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "release/PDF Ping Wheel v1.5.2"
          cp -R dist "release/PDF Ping Wheel v1.5.2/dist"
          cp LICENSE "release/PDF Ping Wheel v1.5.2/LICENSE"
          cp "安装与升级说明.md" "release/PDF Ping Wheel v1.5.2/安装与升级说明.md"
          cp "RIOT_ASSETS_NOTICE.md" "release/PDF Ping Wheel v1.5.2/RIOT_ASSETS_NOTICE.md"
          (cd release && zip -qr "$RUNNER_TEMP/PDF_Ping_Wheel_Chrome_v1.5.2.zip" "PDF Ping Wheel v1.5.2")
          test -s "$RUNNER_TEMP/PDF_Ping_Wheel_Chrome_v1.5.2.zip"
      - name: Create or update GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.5.2
          ASSET: ${{ runner.temp }}/PDF_Ping_Wheel_Chrome_v1.5.2.zip
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## PDF Ping Wheel v1.5.2

          ### 中文介绍
          面向 Chrome / Edge 的本地 PDF 标注扩展。正式安装包预置 9 种游戏信号图标与对应提示音、9 个表情素材和 1 个亮牌图标；支持聊天式备注，并将标记保存为 PDF 原生注释。

          **安装方法**
          1. 下载并解压 `PDF_Ping_Wheel_Chrome_v1.5.2.zip`。
          2. 打开 Chrome 的 `chrome://extensions` 或 Edge 的 `edge://extensions`。
          3. 开启“开发者模式”。
          4. 点击“加载已解压的扩展程序”，选择解压目录中包含 `manifest.json` 的 `PDF Ping Wheel v1.5.2/dist` 文件夹。

          **素材声明：** 游戏图像、表情和音效归 Riot Games 及其相应权利人所有，不属于本项目的 MIT 源码许可证。本项目免费提供，作为独立的非商业粉丝项目分享，不是 Riot Games 官方产品。
          本项目依据 Riot Games 的 “Legal Jibber Jabber” 政策，使用 Riot Games 所有的游戏素材创建。Riot Games 不认可、不赞助本项目。

          ### English Description
          A local PDF annotation extension for Chrome and Edge. The release package bundles nine in-game ping icons and their sound effects, nine emote images, and one mastery icon, alongside chat-like notes and editable native PDF annotations.

          **Installation**
          1. Download and extract `PDF_Ping_Wheel_Chrome_v1.5.2.zip`.
          2. Open `chrome://extensions` in Chrome or `edge://extensions` in Edge.
          3. Enable **Developer mode**.
          4. Click **Load unpacked** and select the `PDF Ping Wheel v1.5.2/dist` folder containing `manifest.json`.

          **Asset notice:** Game images, emotes, and sounds are owned by Riot Games and/or their respective rights holders and are not covered by this project's MIT source-code license. This is a free, non-commercial, independent fan project, not an official Riot Games product.
          This project was created under Riot Games' "Legal Jibber Jabber" policy using assets owned by Riot Games. Riot Games does not endorse or sponsor this project.

          The package is published only after all 28 asset files are downloaded and validated and the automated build, PDF round-trip, static checks, and PDF annotation migration tests pass.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "PDF Ping Wheel v1.5.2" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release delete-asset "$TAG" "PDF_Ping_Wheel_Chrome_v1.5.2_.zip" --yes --repo "$GITHUB_REPOSITORY" || true
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --title "PDF Ping Wheel v1.5.2" --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
          fi
